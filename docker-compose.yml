version: '3.8'

services:
  tankuy-api:
    build: 
      context: ./server
    container_name: tankuy-api
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - ./server/.env
    networks:
      - tankuy-network

  tankuy-app:
    build:
      context: ./app
      args:
        # Inlined into the static web build at build time
        - EXPO_PUBLIC_API_URL=https://tankuy.dejny.eu
    container_name: tankuy-app
    restart: unless-stopped
    ports:
      - "8085:8085"
    networks:
      - tankuy-network

networks:
  tankuy-network:
    name: tankuy-network
